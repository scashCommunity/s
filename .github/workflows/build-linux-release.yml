# Build Linux x86_64 release binaries for Scash
# Trigger manually via workflow_dispatch

name: Build Linux Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to build (e.g. v2.0.1)'
        required: true
        default: 'v2.0.1'

jobs:
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version }}

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential libtool autotools-dev automake pkg-config \
            bsdmainutils curl git cmake bison \
            libqt5gui5 libqt5core5a libqt5dbus5 libqt5network5 \
            qttools5-dev qttools5-dev-tools \
            libssl-dev libevent-dev libboost-all-dev \
            libsqlite3-dev libdb++-dev libminiupnpc-dev libnatpmp-dev \
            libqrencode-dev libzmq3-dev

      - name: Cache depends
        uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/sources
          key: ${{ runner.os }}-depends-${{ github.event.inputs.version }}-${{ hashFiles('depends/packages/*') }}

      - name: Build depends
        run: |
          ./autogen.sh
          make -C depends -j $(nproc)

      - name: Configure and build
        run: |
          CONFIG_SITE=$PWD/depends/x86_64-pc-linux-gnu/share/config.site ./configure --prefix=$PWD/depends/x86_64-pc-linux-gnu
          make -j $(nproc)

      - name: Package
        run: |
          mkdir -p scash-linux
          cp src/bitcoind src/bitcoin-cli src/bitcoin-tx src/bitcoin-wallet src/qt/bitcoin-qt scash-linux/
          cd scash-linux
          tar czf ../scash-${{ github.event.inputs.version }}-linux-x86_64.tar.gz .
          cd ..
          sha256sum scash-${{ github.event.inputs.version }}-linux-x86_64.tar.gz > SHA256SUMS-linux.txt

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version }}
          files: |
            scash-${{ github.event.inputs.version }}-linux-x86_64.tar.gz
            SHA256SUMS-linux.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
